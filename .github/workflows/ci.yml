name: build-and-test

on:
  push:
    branches: [master, hardening-aa]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 build + IR smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 libxml2-dev
      - name: Build + smoke
        run: |
          # The full clang build is heavy; this compiles the obfuscation
          # source and runs a tiny C program under the IR passes to confirm
          # the Linux build path is intact. See docs/BUILD_LINUX.md.
          scripts/build-linux.sh
      - name: Linux smoke suite
        run: bash testing/scripts/linux_smoke.sh
      - name: AArch64 IR cross-compile smoke
        run: bash testing/scripts/aarch64_smoke.sh

  windows:
    name: Windows x64 build + test suite
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up vcpkg + libxml2
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 7adc2e4d50e3e9a902a931c93a15d5574966ecf1
      - name: Install vcpkg libxml2 (static)
        run: vcpkg install libxml2:x64-windows-static
      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: .\scripts\configure-release.ps1
      - name: Build clang/opt
        shell: cmd
        run: .\scripts\build-clang.cmd
      - name: Run test suite (default mode)
        shell: cmd
        run: python testing\run_obfuscation_tests.py --mode default --keep-going
